name: Phase2A lockfile generator

on:
  push:
    branches:
      - feat/phase2a-storage-foundation

permissions:
  contents: write

jobs:
  lockgen:
    if: ${{ !contains(github.event.head_commit.message, '[lockgen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase2a-storage-foundation

      - uses: oven-sh/setup-bun@v2

      - name: Generate lockfile with fake-indexeddb
        run: bun add --dev --exact fake-indexeddb@6.2.5

      - name: Commit generated manifest and lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock
          git commit -m "chore: add fake-indexeddb test dependency [lockgen]"
          git push origin HEAD:feat/phase2a-storage-foundation
